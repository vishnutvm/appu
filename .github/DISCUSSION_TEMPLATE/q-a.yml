title: Q&A
body:
  - type: markdown
    attributes:
      value: |
        Ask a question about building, running, or extending Appu.
        For bugs, use [Bug report](https://github.com/vishnutvm/appu/issues/new?template=bug_report.yml) instead.
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Source build
        - Other
