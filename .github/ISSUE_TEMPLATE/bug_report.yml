name: Bug report
description: Something is broken or regressed
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue. Please search [existing issues](https://github.com/vishnutvm/appu/issues) first.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Linux (dev only, Electron)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Appu version
      description: Release tag or `main` commit SHA
      placeholder: "v1.0.4 or git sha"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npm start   # desktop companion
        2. Open chat
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Redact API keys and personal data
